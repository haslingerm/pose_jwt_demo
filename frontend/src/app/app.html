<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
               [attr.role]="isHandset() ? 'dialog' : 'navigation'"
               [mode]="isHandset() ? 'over' : 'side'"
               [opened]="!isHandset()">
    <mat-toolbar>
      @if (showTitleInSidenav()) {
        <span>{{ title }}</span>
      } @else {
        <span>Menu</span>
      }
    </mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/home" routerLinkActive #home="routerLinkActive" [activated]="home.isActive">Home</a>
      <a mat-list-item routerLink="/login" routerLinkActive #login="routerLinkActive" [activated]="login.isActive">
        {{ user() ? 'Logout' : 'Login' }}
      </a>
      <a mat-list-item routerLink="/products" routerLinkActive #products="routerLinkActive" [activated]="products.isActive">
        Products
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar>
      @if (isHandset()) {
        <button
          type="button"
          aria-label="Toggle sidenav"
          matIconButton
          (click)="drawer.toggle()">
          <mat-icon aria-hidden="true">menu</mat-icon>
        </button>
        <span>{{ title }}</span>
      }
      <span class="spacer"></span>
      @if (user(); as user) {
        <mat-icon aria-hidden="true">person</mat-icon>
        <span class="username">{{ user.username }}</span>
      }
    </mat-toolbar>
    <main id="main-container">
      <router-outlet/>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
