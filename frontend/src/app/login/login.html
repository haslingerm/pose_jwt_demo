@let loggedIn = isLoggedIn();
<form [formGroup]="loginForm" novalidate (ngSubmit)="submit()">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (!loggedIn) {
        <div class="row">
          <div class="col">
            <mat-form-field class="full-width">
              <input matInput placeholder="Username" formControlName="username">
              @if (loginForm.controls['username'].hasError('required')) {
                <mat-error>Username is <strong>required</strong></mat-error>
              }
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <mat-form-field class="full-width">
              <input matInput placeholder="Password" formControlName="password" type="password">
              @if (loginForm.controls['password'].hasError('required')) {
                <mat-error>Password is <strong>required</strong></mat-error>
              }
            </mat-form-field>
          </div>
        </div>
      } @else {
        <div>
          You are logged in as {{ userName() }}
        </div>
      }
    </mat-card-content>
    <mat-card-actions class="actions">
      <button mat-raised-button color="secondary" [disabled]="!loggedIn"
              (click)="logout(); $event.preventDefault();">
        Logout</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="loggedIn">
        Login
      </button>
    </mat-card-actions>
  </mat-card>
</form>
