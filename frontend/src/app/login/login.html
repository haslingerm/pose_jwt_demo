@let loggedIn = isLoggedIn();
<mat-card class="login-card">
  <mat-card-header>
    <mat-card-title>Login</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form>
      @if (!loggedIn) {
        <div class="row">
          <div class="col">
            <mat-form-field class="full-width">
              <input matInput placeholder="Username" [formField]="loginForm.username">
              @for (error of loginForm.username().errors(); track error) {
                <mat-error>{{ error }}</mat-error>
              }
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <mat-form-field class="full-width">
              <input matInput placeholder="Password" [formField]="loginForm.password" type="password">
              @for (error of loginForm.password().errors(); track error) {
                <mat-error>{{ error }}</mat-error>
              }
            </mat-form-field>
          </div>
        </div>
      } @else {
        <div>
          You are logged in as {{ userName() }}
        </div>
      }
    </form>
  </mat-card-content>
  <mat-card-actions class="actions">
    <button mat-raised-button color="secondary" [disabled]="!loggedIn"
            (click)="logout(); $event.preventDefault();">
      Logout
    </button>
    <button mat-raised-button color="primary" type="submit" [disabled]="loggedIn">
      Login
    </button>
  </mat-card-actions>
</mat-card>
